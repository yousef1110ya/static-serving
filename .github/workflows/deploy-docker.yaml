name: deploy docker
#
on:
    push:
        branches: [main]
    workflow_dispatch:

env:
    IMAGE_NAME: static-serving 

jobs:
    build_and_push:
        name: Build and Push
        runs-on: ubuntu-latest
        outputs:
            version2: ${{ steps.version.outputs.version2 }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to DockerHub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_PASSWORD }}

            - name: Get version info
              id: version
              run: |
                  VERSION="${{ github.ref_name }}"
                  VERSION2="${{ github.ref_name }}-${{ github.run_number }}"
                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  echo "version2=$VERSION2" >> $GITHUB_OUTPUT

            - name: Build and push Docker image
              run: |
                  echo "${{ secrets.TOKEN_NPM_READ_ONLY }}" > .npmrc
                  echo "${{ secrets.NPM_REGISTRY }}" >> .npmrc
                  docker build --pull . --file Dockerfile --tag ${IMAGE_NAME}
                  VERSION="${{ steps.version.outputs.version }}"
                  VERSION2="${{ steps.version.outputs.version2 }}"
                  IMAGE="${{ secrets.DOCKERHUB_NAMESPACE }}/${IMAGE_NAME}"

                  # Tag and push with branch name
                  docker tag "${IMAGE_NAME}" "${IMAGE}:${VERSION}"
                  echo "${IMAGE}:${VERSION}"
                  docker push "${IMAGE}:${VERSION}"

                  # Tag and push with branch-build number
                  docker tag "${IMAGE_NAME}" "${IMAGE}:${VERSION2}"
                  echo "${IMAGE}:${VERSION2}"
                  docker push "${IMAGE}:${VERSION2}"

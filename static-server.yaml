# ============================================================
# Namespace
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: static-server

---
# ============================================================
# PersistentVolumeClaim
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: static-files-pvc
  namespace: static-server
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: openebs-hostpath

---
# ============================================================
# Nginx ConfigMap — single port, /files/ and /api/ paths
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: static-server
data:
  default.conf: |
    server {
      listen 80;

      location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
      }

      location /files/ {
        alias /srv/files/;
        default_type text/plain;
        try_files $uri =404;
      }

      location /api/ {
        proxy_pass http://localhost:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }
    }

---
# ============================================================
# Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-server
  namespace: static-server
  labels:
    app: static-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: static-server
  template:
    metadata:
      labels:
        app: static-server
    spec:
      containers:
        - name: static-server
          image: birobyte1110/static-serving:master
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: files
              mountPath: /srv/files
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:                          # <-- same level as containers
        - name: files
          persistentVolumeClaim:
            claimName: static-files-pvc
        - name: nginx-config
          configMap:
            name: nginx-config

---
# ============================================================
# Service — single port 80
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: static-server
  namespace: static-server
spec:
  selector:
    app: static-server
  ports:
    - name: http
      port: 80
      targetPort: 80

---
# ============================================================
# Ingress
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: static-server-ingress
  namespace: static-server
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - yousuf.static.alefiot.xyz
      secretName: static-server-tls
  rules:
    - host: yousuf.static.alefiot.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: static-server
                port:
                  number: 80

---
# ============================================================
# Certificate
# ============================================================
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: static-server-cert
  namespace: static-server
spec:
  secretName: static-server-tls
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
  dnsNames:
    - yousuf.static.alefiot.xyz
